services:
    app:
        build: .
        restart: unless-stopped
        ports:
            - "8000:8000"
        volumes:
            - .:/app
        environment:
            APP_ENV: dev
            DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}?serverVersion=8.4.0&charset=utf8mb4"
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_NAME}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
            interval: 5s
            timeout: 5s
            retries: 10

    phpmyadmin:
        image: phpmyadmin:5.2-apache
        restart: unless-stopped
        ports:
            - "127.0.0.1:8081:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    mysql_data:

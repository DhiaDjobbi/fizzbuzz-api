services:
    app:
        build: .
        restart: unless-stopped
        ports:
            - "8000:8000"
        volumes:
            - .:/app
        environment:
            APP_ENV: dev
            DATABASE_URL: "mysql://fizzbuzz:fizzbuzz_dev_password@mysql:3306/fizzbuzz?serverVersion=8.4.0&charset=utf8mb4"
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: fizzbuzz
            MYSQL_USER: fizzbuzz
            MYSQL_PASSWORD: fizzbuzz_dev_password
            MYSQL_ROOT_PASSWORD: root_dev_password
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
            interval: 5s
            timeout: 5s
            retries: 10

    phpmyadmin:
        image: phpmyadmin:5.2-apache
        restart: unless-stopped
        ports:
            - "127.0.0.1:8081:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    mysql_data:
